# Tira Mail - institution-controlled sender maps.
#
# Two small maps, not a second spam filter. Volume blocking belongs to DNSBLs
# and the statistical classifier; these lists exist for the cases a Rector's
# office actually calls about ("stop this sender", "this partner is fine").
#
# Scoring, not `action = accept`: an allowlisted domain is still scanned.
# Forcing `accept` would let a compromised partner mailbox bypass everything.
#
# Map entries are domains, one per line, lowercase, comments with `#`.

# --- The institution would rather vouch for these ---------------------------
# Example (keep commented until someone signs off in writing):
# uca.ma
# um5.ac.ma

WHITELIST_SENDER_DOMAIN {
  type = "from";
  extract_from = "smtp";
  filter = "email:domain";
  map = "file:///etc/rspamd/maps/allowlist.map";
  score = -10.0;
  description = "Institution allowlist (sender domain)";
}

# --- Known-bad senders -------------------------------------------------------
# Example:
# spam-source.example
BLACKLIST_SENDER_DOMAIN {
  type = "from";
  extract_from = "smtp";
  filter = "email:domain";
  map = "file:///etc/rspamd/maps/blocklist.map";
  score = 10.0;
  description = "Institution blocklist (sender domain)";
}

