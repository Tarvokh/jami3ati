# Tira Mail - Rspamd action thresholds.
#
# These are the documented Rspamd values, written down explicitly instead of
# inherited from a package default so that an upgrade cannot silently move the
# spam boundary. They are only useful once there is a labelled corpus from this
# deployment; before that, do not "tune" them.
reject = 15;
add_header = 6;
greylist = 4;
