# Tira Mail - DKIM signing is owned by Stalwart, not Rspamd.
#
# Stalwart generates the RSA-2048 and Ed25519 keys per domain, rotates them on
# its own schedule, and exposes the matching `p=` values in `dnsZoneFile`.
# Adding a second signer would mean two keys, two rollover dates, and a
# receiver that distrusts the domain as soon as either signature fails.
#
# Keep this file as documentation of the decision. Do not flip it on without
# also disabling Stalwart's DKIM management for the domain.
enabled = false;
